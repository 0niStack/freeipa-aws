services:
  freeipa:
    image: ${IPA_IMAGE:-freeipa/freeipa-server:rocky-9}
    container_name: freeipa
    hostname: ${IPA_HOSTNAME}
    restart: unless-stopped
    userns_mode: "host"
    stdin_open: true
    tty: true
    environment:
      PASSWORD: ${IPA_ADMIN_PASSWORD}
      IPA_SERVER_IP: ${IPA_IP}
    # NTP is disabled: AWS Time Sync keeps the host clock accurate and the
    # container shares the host kernel clock.
    command: >
      ipa-server-install -U
      --domain=${IPA_DOMAIN}
      --realm=${IPA_REALM}
      --setup-dns
      --forwarder=${IPA_FORWARDER}
      --no-reverse
      --no-ntp
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
    volumes:
      - ./data:/data
    # Bound to the private IP so port 53 doesn't clash with systemd-resolved
    # (which listens on 127.0.0.53 on Ubuntu).
    ports:
      - "${IPA_IP}:53:53/udp"
      - "${IPA_IP}:53:53/tcp"
      - "${IPA_IP}:80:80/tcp"
      - "${IPA_IP}:443:443/tcp"
      - "${IPA_IP}:389:389/tcp"
      - "${IPA_IP}:636:636/tcp"
      - "${IPA_IP}:88:88/tcp"
      - "${IPA_IP}:88:88/udp"
      - "${IPA_IP}:464:464/tcp"
      - "${IPA_IP}:464:464/udp"
